name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !LICENSE

  build:
    name: Maven verify (pr profile)
    runs-on: ubuntu-latest
    # Activates once the Maven skeleton lands (M0). Until then the job is skipped, not failed.
    if: ${{ hashFiles('pom.xml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -Ppr verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results
          path: '**/allure-results'
          if-no-files-found: ignore
